<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мелотрек — лидеры</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
    <header class="hero small">
        <h1>Таблица лидеров</h1>
        <p class="sub">{{ game.title }}</p>
    </header>

    <section class="panel">
        <div id="aiFinal" class="ai-comment" style="display:none;margin-bottom:16px"></div>
        <ol class="leaderboard">
            {% for name, score in rows %}
            <li><span class="team">{{ name }}</span><span class="score">{{ score }}</span></li>
            {% endfor %}
        </ol>
        <a href="/play/{{ game.id }}" class="secondary" style="display:inline-block;margin-top:16px">← Вернуться к игре</a>
        <a href="/" class="secondary" style="display:inline-block;margin-top:16px">На главную</a>
    </section>
</div>
<script>
// итоговое слово от ИИ-ведущего
fetch('/games/{{ game.id }}/final').then(r => r.json()).then(d => {
    if (d.words) {
        const el = document.getElementById('aiFinal');
        el.textContent = '🎤 ' + d.words;
        el.style.display = 'block';
    }
});
</script>
</body>
</html>
